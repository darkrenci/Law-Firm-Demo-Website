    <script>
      (function () {
        // Prevent benign ResizeObserver loop errors from surfacing as unhandled exceptions
        function isResizeObserverError(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return msg.includes('ResizeObserver loop completed with undelivered notifications') ||
                 msg.includes('ResizeObserver loop limit exceeded');
        }

        window.addEventListener('error', function (e) {
          if (isResizeObserverError(e.message)) {
            e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reasonMsg = e && e.reason && (e.reason.message || String(e.reason));
          if (isResizeObserverError(reasonMsg)) {
            e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        if (typeof window !== 'undefined' && window.ResizeObserver) {
          var OriginalResizeObserver = window.ResizeObserver;
          window.ResizeObserver = class SafeResizeObserver extends OriginalResizeObserver {
            constructor(callback) {
              super(function (entries, observer) {
                window.requestAnimationFrame(function () {
                  callback(entries, observer);
                });
              });
            }
          };
        }
      })();
    </script>
