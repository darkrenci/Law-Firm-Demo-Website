<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="attBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#12100e"/>
      <stop offset="100%" stop-color="#080709"/>
    </linearGradient>
    <radialGradient id="attGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c59b63" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="attGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d8"/>
      <stop offset="50%" stop-color="#c59b63"/>
      <stop offset="100%" stop-color="#8a6d3b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#attBg)"/>
  <rect width="600" height="750" fill="url(#attGlow)"/>

  <!-- Border & Accents -->
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="#c59b63" stroke-width="1.5" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="694" fill="none" stroke="#8a6d3b" stroke-width="0.5" opacity="0.4"/>

  <!-- Corner Accents -->
  <path d="M 20 50 L 50 20 M 550 20 L 580 50 M 20 700 L 50 730 M 550 730 L 580 700" stroke="#c59b63" stroke-width="1.5"/>

  <!-- Center Executive Portrait Silhouette & Crest -->
  <g transform="translate(300, 320)" text-anchor="middle">
    <!-- Outer Crest Circle -->
    <circle cx="0" cy="-60" r="90" fill="#141210" stroke="url(#attGold)" stroke-width="2"/>
    <circle cx="0" cy="-60" r="82" fill="none" stroke="#c59b63" stroke-width="0.75" stroke-dasharray="4 3"/>

    <!-- Scales of Justice -->
    <g stroke="url(#attGold)" stroke-width="2.5" fill="none" transform="translate(0, -65)">
      <line x1="-36" y1="-8" x2="36" y2="-8"/>
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="-18" y1="28" x2="18" y2="28" stroke-width="3"/>
      <circle cx="0" cy="-28" r="4" fill="url(#attGold)"/>
      <line x1="-36" y1="-8" x2="-48" y2="14"/>
      <line x1="-36" y1="-8" x2="-24" y2="14"/>
      <path d="M -52 14 Q -36 24 -20 14 Z" fill="url(#attGold)"/>
      <line x1="36" y1="-8" x2="24" y2="14"/>
      <line x1="36" y1="-8" x2="48" y2="14"/>
      <path d="M 20 14 Q 36 24 52 14 Z" fill="url(#attGold)"/>
    </g>

    <!-- Firm Insignia -->
    <text y="90" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="700" fill="#f4e6d0" letter-spacing="4">
      LALUSIS &amp; PARTNERS
    </text>
    <text y="118" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="600" fill="#c59b63" letter-spacing="3">
      ATTORNEYS AT LAW
    </text>
    <text y="145" font-family="'Inter', sans-serif" font-size="11" fill="#8a837a" letter-spacing="1">
      Official Chamber Portrait
    </text>
  </g>
</svg>
