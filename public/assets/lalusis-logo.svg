<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lpGoldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f7e1b5" />
      <stop offset="18%" stop-color="#dfb277" />
      <stop offset="42%" stop-color="#c59b63" />
      <stop offset="70%" stop-color="#9e733c" />
      <stop offset="90%" stop-color="#c59b63" />
      <stop offset="100%" stop-color="#7a5528" />
    </linearGradient>

    <linearGradient id="lpGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecd2" />
      <stop offset="35%" stop-color="#dfb277" />
      <stop offset="75%" stop-color="#c59b63" />
      <stop offset="100%" stop-color="#966e38" />
    </linearGradient>

    <linearGradient id="lpGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b58a4e" />
      <stop offset="40%" stop-color="#875e29" />
      <stop offset="80%" stop-color="#694519" />
      <stop offset="100%" stop-color="#4d3210" />
    </linearGradient>

    <radialGradient id="lpBowlGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecd5aa" />
      <stop offset="45%" stop-color="#c59b63" />
      <stop offset="85%" stop-color="#875e29" />
      <stop offset="100%" stop-color="#573812" />
    </radialGradient>

    <linearGradient id="lpSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#966e38" />
      <stop offset="30%" stop-color="#faecd2" />
      <stop offset="50%" stop-color="#f2d7a2" />
      <stop offset="70%" stop-color="#c59b63" />
      <stop offset="100%" stop-color="#7a5528" />
    </linearGradient>
  </defs>

  <!-- Top Bracketed Serif of "L" -->
  <path d="M 68 60 C 86 61, 91 75, 91 85 L 125 85 C 125 75, 130 61, 163 60 C 142 62, 110 61.5, 68 60 Z" fill="url(#lpSheen)" />

  <!-- Outer Left Vertical Border Stroke -->
  <path d="M 86 85 L 91 85 L 91 350 L 86 350 Z" fill="url(#lpGoldLight)" />

  <!-- Main Solid Vertical Column of "L" -->
  <path d="M 107 85 L 125 85 L 125 350 L 107 350 Z" fill="url(#lpGoldGrad)" />

  <!-- Bottom Left Corner Serif Bracket -->
  <path d="M 68 380 C 86 379, 91 365, 91 350 L 145 350 L 145 362 L 91 362 C 91 372, 85 379, 68 380 Z" fill="url(#lpGoldGrad)" />

  <!-- Bottom Horizontal Base of "L" -->
  <path d="M 145 362 L 328 362 L 328 367 L 145 367 Z" fill="url(#lpGoldDark)" />
  <path d="M 145 375 L 328 375 L 328 380 L 68 380 L 68 375 Z" fill="url(#lpGoldGrad)" />

  <!-- Upward Sweeping Triangular Finial at Right of "L" -->
  <path d="M 328 380 L 328 322 C 328 345, 310 360, 275 362 L 328 362 Z" fill="url(#lpGoldLight)" />

  <!-- Diamond Finial Apex at Top -->
  <polygon points="200,52 180,108 200,114" fill="url(#lpGoldLight)" />
  <polygon points="200,52 220,108 200,114" fill="url(#lpGoldDark)" />

  <!-- Ricasso / Shoulder Notches below the Crossbeam -->
  <polygon points="200,114 180,114 175,155 200,155" fill="url(#lpGoldLight)" />
  <polygon points="200,114 220,114 225,155 200,155" fill="url(#lpGoldDark)" />

  <!-- Center Diamond / Notched Step -->
  <polygon points="175,155 180,165 200,160 200,155" fill="url(#lpGoldDark)" />
  <polygon points="225,155 220,165 200,160 200,155" fill="url(#lpGoldLight)" />

  <!-- Long Tapered Dagger Blade -->
  <polygon points="200,160 180,165 190,320 200,358" fill="url(#lpGoldLight)" />
  <polygon points="200,160 220,165 210,320 200,358" fill="url(#lpGoldDark)" />

  <!-- Center Ridge Highlight -->
  <line x1="200" y1="52" x2="200" y2="358" stroke="#faecd2" stroke-width="1.2" opacity="0.85" />

  <!-- Left Arm of Balance Beam -->
  <path d="M 180 112 C 145 112, 100 118, 84 126 L 84 131 C 102 123, 145 117, 180 117 Z" fill="url(#lpGoldLight)" />
  <path d="M 84 126 C 80 126, 78 132, 84 135 C 88 132, 88 126, 84 126 Z" fill="url(#lpSheen)" />

  <!-- Right Arm of Balance Beam -->
  <path d="M 220 112 C 255 112, 300 118, 316 126 L 316 131 C 298 123, 255 117, 220 117 Z" fill="url(#lpGoldDark)" />
  <path d="M 316 126 C 312 126, 310 132, 316 135 C 320 132, 320 126, 316 126 Z" fill="url(#lpSheen)" />

  <!-- Left Scale Hanging Chains -->
  <line x1="84" y1="133" x2="43" y2="240" stroke="url(#lpGoldLight)" stroke-width="1.7" />
  <line x1="84" y1="133" x2="84" y2="240" stroke="url(#lpGoldGrad)" stroke-width="1.7" />
  <line x1="84" y1="133" x2="125" y2="240" stroke="url(#lpGoldDark)" stroke-width="1.7" />

  <!-- Left Scale Pan Bowl -->
  <path d="M 38 240 C 38 274, 130 274, 130 240 Z" fill="url(#lpBowlGrad)" stroke="url(#lpGoldLight)" stroke-width="1.8" />
  <line x1="37" y1="240" x2="131" y2="240" stroke="#faecd2" stroke-width="2.2" />

  <!-- Right Scale Hanging Chains -->
  <line x1="316" y1="133" x2="275" y2="240" stroke="url(#lpGoldLight)" stroke-width="1.7" />
  <line x1="316" y1="133" x2="316" y2="240" stroke="url(#lpGoldGrad)" stroke-width="1.7" />
  <line x1="316" y1="133" x2="357" y2="240" stroke="url(#lpGoldDark)" stroke-width="1.7" />

  <!-- Right Scale Pan Bowl -->
  <path d="M 270 240 C 270 274, 362 274, 362 240 Z" fill="url(#lpBowlGrad)" stroke="url(#lpGoldLight)" stroke-width="1.8" />
  <line x1="269" y1="240" x2="363" y2="240" stroke="#faecd2" stroke-width="2.2" />
</svg>
